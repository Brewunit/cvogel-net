<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#202222">
  <meta name="description" content="Request a quote from C Vogel Designs for a website, merch, or both.">
  <title>Get a quote — C Vogel Designs</title>
  <link rel="icon" href="assets/logo.png" type="image/png">
  <link rel="preload" href="assets/Archivo-Bold.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="hero-fullscreen.css?v=quote">
</head>
<body class="quote-page">
  <header class="site-header quote-header">
    <a class="brand" href="index.html" aria-label="C Vogel Designs home"><img src="assets/logo.png" alt="CVD" width="112" height="53"><span>C Vogel<br>Designs</span></a>
    <nav aria-label="Main navigation"><a href="index.html#work">Work</a><a href="index.html">Home</a><a class="nav-contact" href="index.html#contact">Let’s talk <span aria-hidden="true">↗</span></a></nav>
  </header>
  <main class="quote-main">
    <p class="quote-kicker">Quote</p>
    <h1>Tell me what you’re after.</h1>
    <p class="quote-lead">Website, merch, or both. A few specifics now saves a round of email.</p>
    <p id="quote-sent" class="quote-sent" hidden>Got it. I’ll look it over and follow up at the email you left.</p>
    <form id="quote-form" action="https://formsubmit.co/me@cvogel.net" method="POST">
      <input type="hidden" name="_subject" value="CVD quote">
      <input type="hidden" name="_template" value="table">
      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_next" id="quote-next" value="">
      <input type="text" name="_honey" class="honey" tabindex="-1" autocomplete="off">
      <label>Name <input name="name" required maxlength="120" autocomplete="name"></label>
      <label>Email <input name="email" type="email" required maxlength="160" autocomplete="email"></label>
      <label>Phone <span>(optional)</span> <input name="phone" type="tel" maxlength="40" autocomplete="tel"></label>
      <label>Business <span>(optional)</span> <input name="business" maxlength="160"></label>
      <fieldset>
        <legend>I need</legend>
        <label class="check"><input type="checkbox" name="need" value="Website"><span>A website</span></label>
        <label class="check"><input type="checkbox" name="need" value="Merch"><span>Merch</span></label>
        <label class="check"><input type="checkbox" name="need" value="Both"><span>Both</span></label>
        <label class="check"><input type="checkbox" name="need" value="Not sure"><span>Not sure yet</span></label>
      </fieldset>
      <label>Budget
        <select name="budget" required>
          <option value="" disabled selected>Select</option>
          <option value="Under $1k">Under $1k</option>
          <option value="$1k–$3k">$1k–$3k</option>
          <option value="$3k–$8k">$3k–$8k</option>
          <option value="$8k+">$8k+</option>
          <option value="Not sure">Not sure</option>
        </select>
      </label>
      <label>When
        <select name="when" required>
          <option value="" disabled selected>Select</option>
          <option value="ASAP">ASAP</option>
          <option value="This month">This month</option>
          <option value="1–3 months">1–3 months</option>
          <option value="Just looking">Just looking</option>
        </select>
      </label>
      <label>The project <span>(what it is, who it’s for)</span>
        <textarea name="project" required rows="5" maxlength="2400" placeholder="A sentence or two is enough."></textarea>
      </label>
      <button class="email-button" type="submit">Send quote request</button>
      <p class="form-note">Goes to me@cvogel.net. No account required.</p>
    </form>
  </main>
  <script>
    (function(){
      var next=document.getElementById('quote-next');
      if(next) next.value=location.href.split('?')[0]+'?sent=1';
      if(/[?&]sent=1/.test(location.search)){
        var n=document.getElementById('quote-sent');
        if(n) n.hidden=false;
        var f=document.getElementById('quote-form');
        if(f) f.hidden=true;
      }
    })();
  </script>
</body>
</html>
